<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laplace Solutions</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="../media/Logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05080F;
            --text: #B4BECC;
            --white: #FFFFFF;
            --muted: #8792A3;
            --sky: #33B5EA;
            --line: rgba(233, 238, 246, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 17px;
            line-height: 1.65;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a:focus-visible, button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

        .site-header { border-bottom: 1px solid var(--line); }

        .site-header .bar {
            max-width: 1240px;
            margin: 0 auto;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px 28px;
        }

        .site-header img { height: 46px; width: auto; display: block; }

        #lang-switch {
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 2px;
        }

        #lang-switch:hover { color: var(--white); }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 80px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        main::before {
            content: '';
            position: absolute;
            width: 640px;
            height: 640px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(51, 181, 234, 0.16), transparent 65%);
            pointer-events: none;
        }

        .soon { position: relative; max-width: 560px; }

        h1 {
            color: var(--white);
            font-weight: 600;
            font-size: clamp(38px, 6vw, 64px);
            line-height: 1.1;
            letter-spacing: -0.025em;
            margin-bottom: 20px;
        }

        .soon p { margin-bottom: 36px; }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: var(--white);
            background: var(--sky);
            color: #05080F;
            font-weight: 600;
            font-size: 15px;
            border-radius: 999px;
            padding: 12px 26px;
        }

        .btn:hover { background: #5CC5F0; }

        .site-footer { border-top: 1px solid var(--line); padding: 30px 28px; }

        .site-footer .wrap {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--muted);
        }

        .site-footer img { height: 40px; width: auto; display: block; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="bar">
            <img src="../media/Laplace-solutions_logo_blanc.svg" alt="Laplace Solutions">
            <button id="lang-switch" type="button" lang="en" aria-label="English version">EN</button>
        </div>
    </header>

    <main>
        <div class="soon">
            <h1>Bientôt disponible!</h1>
            <p>La version française de notre site est en préparation. D'ici là, notre site anglais présente nos services, et vous pouvez nous écrire en français.</p>
            <a class="btn" href="../en/" lang="en">Visit the English site</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <img src="../media/Laplace-solutions_logo_blanc.svg" alt="Laplace Solutions">
            <span>&copy; 2026 Laplace Solutions</span>
        </div>
    </footer>

    <script src="../js/lang-switch.js"></script>
</body>
</html>
